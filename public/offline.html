<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The room</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; color: #f1f2f5; font-family: system-ui, Roboto, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; }
      h1 { margin: 0; font-size: 26px; }
      p { margin: 0; color: #8b93a1; line-height: 1.5; }
      button { align-self: flex-start; padding: 13px 20px; border: 0; border-radius: 12px; background: #5ef0a0; color: #06170d; font: inherit; font-weight: 650; }

  <body>
    <main>
      <h1>No connection</h1>
      <p>The room needs the internet to open and to talk to OpenAI. Check your Wi-Fi or mobile data, then try again.</p>
      <button onclick="location.href = 'https://the-room-seven-kappa.vercel.app/'">Try again</button>
    </main>
  </body>
</html>
